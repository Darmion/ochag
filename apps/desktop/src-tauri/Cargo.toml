[package]
name = "ochag"
version = "0.2.0"
description = "Ochag — a virtual tabletop with the server on the game master's own computer"
authors = ["Jasip"]
license-file = "../../../LICENSE.md"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusty-leveldb = "4.0.2"
getrandom = "0.3"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
webview2-com = "0.39.1"
windows = "0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
