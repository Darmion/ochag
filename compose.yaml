name: ttrpg-foundation
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ttrpg
      POSTGRES_USER: ttrpg_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/workspace/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttrpg_dev -d ttrpg"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
